---
collections:
  - name: community.postgresql
  - name: community.general
  - name: ansible.posix

roles:
  - name: pgvillage.avchecker
    version: "v0.2.5"
  - name: pgvillage.chainsmith
    version: "v0.2.4"
  - name: pgvillage.etcd
    version: "v0.2.2"
  - name: pgvillage.firewall
    version: "v0.2.1"
  - name: pgvillage.haproxy
    version: "v0.3.5"
  - name: pgvillage.keepalived
    version: "v0.3.4"
  - name: pgvillage.linux
