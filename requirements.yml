---
collections:
  - name: community.postgresql
  - name: community.general
  - name: ansible.posix

roles:
  - name: pgvillage.avchecker
    version: "v0.2.6"
  - name: pgvillage.chainsmith
    # Use the explicit controller/recipient groups; replace with a release once these changes are published.
    src: https://github.com/pgvillage/ansible-role-chainsmith.git
    scm: git
    version: fix/chainsmith-localhost-dependency
  - name: pgvillage.etcd
    version: "v0.2.3"
  - name: pgvillage.firewall
    version: "v0.2.2"
  - name: pgvillage.haproxy
    version: "v0.3.6"
  - name: pgvillage.keepalived
    version: "v0.3.5"
  - name: pgvillage.linux
    # v0.3.9 and newer create the rustfs user on backup instead of minio (tasks/rustfs_user.yml renames minio first)
    version: "v0.4.0"
  - name: pgvillage.minio
    version: "v0.3.2"
  - name: pgvillage.nagios
    version: "v0.5.0"
  - name: pgvillage.pgfga
    version: "v0.4.0"
  - name: pgvillage.pgquartz
    version: "v0.3.4"
  - name: pgvillage.pgroute66
    version: "v0.3.7"
  - name: pgvillage.pgbouncer
    version: "v0.3.5"
  - name: pgvillage.stolon
    version: "v0.5.0"
  - name: pgvillage.walg
    version: "v0.4.0"
