    version: "v0.3.10"
  - name: pgvillage.minio
    version: "v0.3.2"
  - name: pgvillage.nagios
    version: "v0.4.0"
  - name: pgvillage.pgfga
    version: "v0.3.2"
  - name: pgvillage.pgquartz
    version: "v0.3.3"
  - name: pgvillage.pgroute66
    version: "v0.3.6"
