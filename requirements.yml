---
collections:
  - name: community.postgresql
  - name: community.general
  - name: ansible.posix

roles:
  - name: pgvillage.avchecker
    version: "v0.2.6"
  - name: pgvillage.chainsmith
    # v0.3.0 and newer make rustfs the owner of the backup certificates (chainsmith_users); tasks/rustfs_user.yml
    # renames the minio user to rustfs first. v0.3.1 adds the optional chainsmith_controller and chainsmith_nodes groups
    version: "v0.3.1"
  - name: pgvillage.etcd
    version: "v0.2.3"
  - name: pgvillage.firewall
    version: "v0.2.2"
  - name: pgvillage.haproxy
    version: "v0.3.6"
  - name: pgvillage.keepalived
    version: "v0.3.5"
  - name: pgvillage.linux
    # v0.3.9 and newer create the rustfs user on backup instead of minio (tasks/rustfs_user.yml renames minio first)
    version: "v0.4.0"
  - name: pgvillage.nagios
    version: "v0.5.0"
  - name: pgvillage.pgfga
    version: "v0.4.0"
  - name: pgvillage.pgquartz
    version: "v0.3.4"
  - name: pgvillage.pgroute66
    version: "v0.3.7"
  - name: pgvillage.pgbouncer
    version: "v0.3.5"
  - name: pgvillage.rustfs
    version: "v0.2.0"
  - name: pgvillage.stolon
    version: "v0.5.0"
  - name: pgvillage.walg
    version: "v0.4.0"
