---
name-template: "v$RESOLVED_VERSION 🌈"
tag-template: "v$RESOLVED_VERSION"
exclude-labels:
  - "skip-changelog"
replacers:
  - search: "/CVE-(\\d{4})-(\\d+)/g"
    replace: "https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-$1-$2"
categories:
  - title: "💥 BREAKING CHANGES"
    labels:
      - "breaking"
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
      - "bugfix"
      - "bug"
  - title: "🧰 Maintenance"
    labels:
      - "chore"
      - "documentation"
      - "ci"
      - "refactor"
      - "style"
      - "test"
      - "revert"
      # Dependabot sets this next to the chore label of its title: same category, listed once
      - "dependencies"
  - title: "🔒 Security"
    labels:
      - "security"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: "\\<*_&" # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "refactor"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "documentation"
      - "ci"
      - "style"
      - "test"
  default: patch
# Labels only from the conventional prefix in the title (no title check in this repo yet, see #157), so a PR
# gets one category. Matching on files gave e.g. a fix that also changes docs three labels, and
# release-drafter lists a PR once for every category it matches.
autolabeler:
  - label: "breaking"
    title:
      - "/!:/"
    body:
      - "/BREAKING CHANGE/"
  - label: "chore"
    title:
      - "/^chore(\\(.*\\))?!?:/i"
  - label: "ci"
    title:
      - "/^(ci|build)(\\(.*\\))?!?:/i"
  - label: "documentation"
    title:
      - "/^docs(\\(.*\\))?!?:/i"
  - label: "enhancement"
    title:
      - "/^(feat|perf)(\\(.*\\))?!?:/i"
  - label: "bug"
    title:
      - "/^(fix|hotfix|bug)(\\(.*\\))?!?:/i"
  - label: "refactor"
    title:
      - "/^refactor(\\(.*\\))?!?:/i"
  - label: "revert"
    title:
      - "/^revert(\\(.*\\))?!?:/i"
  - label: "style"
    title:
      - "/^style(\\(.*\\))?!?:/i"
  - label: "test"
    title:
      - "/^test(\\(.*\\))?!?:/i"
template: |
  ## Changes

  $CHANGES
