---
# Overrides inventories/standard/group_vars/all/stolon.yml
# Listen on the shared network of the lima vm's (eth1), not on the default (NAT) interface
stolon_pg_listen_address: "{{ ansible_facts.eth1.ipv4.address }}"
stolon_proxy_listen_address: "{{ ansible_facts.eth1.ipv4.address }}"
# Server certs in /etc/pki/postgres (see group_vars/hacluster/chainsmith.yml)
stolon_pg_certdir: /etc/pki/postgres
