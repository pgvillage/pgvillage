---
# Overrides inventories/standard/group_vars/all/stolon.yml
# Listen on the private network of the vagrant boxes
stolon_pg_listen_address: "{{ ansible_facts.enp0s9.ipv4.address }}"
stolon_proxy_listen_address: "{{ ansible_facts.enp0s9.ipv4.address }}"
# Certificates in /etc/pki/postgres (see chainsmith.yml)
stolon_pg_certdir: "{{ server_cert_path }}"
