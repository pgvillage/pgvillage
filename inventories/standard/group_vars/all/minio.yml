---
minio_server_addr: ":443"
minio_cert_managed: false
# Placeholders: set your own keys in your inventory (with ansible-vault, a HashiCorp Vault lookup, ...).
# Preflight (step 0 of functional-all.yml) fails while they are AWSKEY / AWSSECRET, see
# docs/administrators-guide/deployment_and_maintenance/preflight.md#secrets.
minio_access_key: "AWSKEY"
minio_secret_key: "AWSSECRET"
# One bucket per cluster in stolon_clusters (see walg_clusters.<cluster>.s3_prefix)
minio_buckets:
  - cluster1
  - cluster2

# RustFS instead of minio: the PgVillage repos no longer ship minio (see packages.yml)
minio_use_rustfs: true
# The CA that chainsmith places for the client (minio_cert_managed is false, so the role doesn't set one)
minio_rustfs_client_ca_bundle: "{{ minio_cert_folders.client.path }}root.crt"
