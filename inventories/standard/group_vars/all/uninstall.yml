---
uninstall_services:
  - stolon-proxy@cluster1
  - stolon-sentinel@cluster1
  - stolon-keeper@cluster1
  - stolon-proxy@cluster2
  - stolon-sentinel@cluster2
  - stolon-keeper@cluster2
  - etcd
  - avchecker@cluster1-stolon.service
  - avchecker@cluster1-proxy.service
  - avchecker@cluster2-stolon.service
  - avchecker@cluster2-proxy.service

uninstall_file_list:
  - /var/lib/etcd
  - /var/log/pgquartz
  - /var/log/postgresql
  - /var/log/wal-g
  - "{{ postgresql_data_mountpoint }}/cluster1"
  - "{{ postgresql_data_mountpoint }}/cluster2"
  - "{{ postgresql_data_mountpoint }}/stolon_custom_config-cluster1.yml"
  - "{{ postgresql_data_mountpoint }}/stolon_custom_config-cluster2.yml"
  - "{{ postgresql_data_mountpoint }}/certs"
  - "{{ postgresql_wal_mountpoint }}/stolon"
  - /etc/systemd/system/avchecker@.service
  - /etc/systemd/system/etcd.service
  - /etc/systemd/system/stolon-keeper@.service
  - /etc/systemd/system/stolon-proxy@.service
  - /etc/systemd/system/stolon-sentinel@.service
  - /etc/systemd/system/stolon-keeper@cluster1.service.d
  - /etc/systemd/system/stolon-keeper@cluster2.service.d
  - /etc/sysconfig/stolon-stkeeper-cluster1
  - /etc/sysconfig/stolon-stkeeper-cluster2
  - /etc/sysconfig/stolon-stproxy-cluster1
  - /etc/sysconfig/stolon-stproxy-cluster2
  - /etc/sysconfig/stolon-stsentinel-cluster1
  - /etc/sysconfig/stolon-stsentinel-cluster2
  - /etc/default/wal-g-cluster1
  - /etc/default/wal-g-cluster2
  - /etc/sysctl.d/postgresql.conf
  - "/usr/pgsql-{{ postgresql_version }}"
  - "/var/lib/pgsql-{{ postgresql_version }}"
  - /etc/cron.d/postgresql
  - /etc/cron.d/wal-g
  - /etc/cron.d/pgquartz
  - /etc/pgquartz
  - /usr/local/bin/pgquartz
  - /etc/etcd
  - /etc/systemd/system/multi-user.target.wants/avchecker@cluster1-stolon.service
  - /etc/systemd/system/multi-user.target.wants/avchecker@cluster1-proxy.service
  - /etc/systemd/system/multi-user.target.wants/avchecker@cluster2-stolon.service
  - /etc/systemd/system/multi-user.target.wants/avchecker@cluster2-proxy.service
  - "/etc/systemd/system/postgresql-{{ postgresql_version }}.service"
  - /etc/default/avchecker_cluster1-stolon
  - /etc/default/avchecker_cluster1-proxy
  - /etc/default/avchecker_cluster2-stolon
  - /etc/default/avchecker_cluster2-proxy
  - /opt/avchecker
  - /etc/pgquartz
  - /usr/local/bin/pgquartz

uninstall_user_list:
  - postgres
  - etcd
  - avchecker
  - pgquartz

uninstall_linux_packages:
  - "postgresql{{ linux_pg_version|replace('.','') }}"
  - "postgresql{{ linux_pg_version|replace('.','') }}-server"
  - "postgresql{{ linux_pg_version|replace('.','') }}-contrib"
  - "postgresql{{ linux_pg_version|replace('.','') }}-plpython3"
  - "postgresql{{ linux_pg_version|replace('.','') }}-libs"
  - "stolon"
  - "wal-g-pg"
  - "etcd"
