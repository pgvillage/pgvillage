---
# The role defaults of pgvillage.linux (v0.3.9 and newer), but with the minio user and group on the backup hosts
# instead of rustfs: the pgvillage.minio role runs RustFS as minio_user (minio), and chainsmith, which runs before it,
# gives the backup server certificates to minio (chainsmith_server_cert_owner). Back to the role defaults with the
# switch to the pgvillage.rustfs role.
linux_users:
  hacluster:
    - name: postgres
      shell: /bin/bash
      system: true
    - name: pgbouncer
      shell: /bin/bash
      system: true
    - name: avchecker
      system: true
    - name: pgquartz
      system: true
    - name: pgfga
      system: true
    - name: pgroute66
      system: true
  backup:
    - name: minio
      system: true
  router:
    - name: haproxy
      system: true
    - name: keepalived
      system: true
    - name: pgroute66
      system: true

linux_groups:
  hacluster:
    - name: postgres
      system: true
  backup:
    - name: minio
      system: true
  router:
    - name: pgroute66
      system: true
