---
# pgroute66 runs on the router hosts (see hosts), and tells HAProxy which database host is the primary or a standby of
# every cluster in stolon_clusters.
pgroute66_pgnodes_group: hacluster

# Every cluster in stolon_clusters, with its PostgreSQL port
pgroute66_clusters: >-
  {%- set clusters = {} -%}
  {%- for name, cluster in stolon_clusters.items() -%}
    {%- do clusters.update({name: {"pgport": cluster.sysconfig.stkeeper.pg_port}}) -%}
  {%- endfor -%}
  {{ clusters }}
# The port of the first cluster (the role default for a single cluster)
pgroute66_pgport: "{{ (pgroute66_clusters.values() | first).pgport }}"

pgroute66_config:
  groups: >-
    {%- set hostgroups = {} -%}
    {%- for cluster, clusterconfig in pgroute66_clusters.items() -%}
      {%- set hosts = {} -%}
      {%- for host in groups[pgroute66_pgnodes_group] -%}
        {%- set hv = hostvars[host] -%}
        {%- set host_values = {"host": host, "port": clusterconfig.pgport, "dbname": pgroute66_dbname} -%}
        {%- do hosts.update({host: host_values}) -%}
      {%- endfor -%}
      {%- do hostgroups.update({cluster: hosts}) -%}
    {%- endfor -%}
    {{ hostgroups }}
  loglevel: "{{ pgroute66_loglevel }}"
  verbosity: "{{ pgroute66_verbosity }}"
  bind: "{{ pgroute66_bind }}"
  port: "{{ pgroute66_port }}"
