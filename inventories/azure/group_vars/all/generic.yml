---
# Overrides inventories/standard/group_vars/all/generic.yml

# VIP of the Azure Load Balancer (azure_vip.yml is generated by the azure role)
postgresql_vip_fqdn: "{{ azure_vip_dns_fqdn }}"
postgresql_vip_ip: "{{ azure_vip_ip }}"

stolon_pg_hba:
  # Required for nrpe (and probably others)
  - local all all ident
  - hostssl postgres avchecker samenet cert
  - hostssl all all samenet cert
  # Traffic through the Azure Load Balancer
  - "hostssl all all {{ azure_vip_ip }}/32 cert"
