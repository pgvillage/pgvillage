---
# Overrides inventories/standard/group_vars/all/chainsmith.yml: adds the Azure VIP to the server certificates
chainsmith_hosts: "{{ [azure_vip_dns_fqdn] + (chainsmith_nodes | map('extract', hostvars, ['ansible_facts', 'fqdn']) | list) }}"
chainsmith_ips: "{{ [azure_vip_ip] + (chainsmith_nodes | map('extract', hostvars, 'ansible_host') | list) }}"
# Every name (the VIP and the hosts) gets a certificate for all names and IPs
chainsmith_servers: "{{ dict(chainsmith_hosts | zip_longest([], fillvalue=chainsmith_hosts + chainsmith_ips)) }}"
