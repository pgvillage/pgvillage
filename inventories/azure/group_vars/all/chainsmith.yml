---
# Overrides inventories/standard/group_vars/all/chainsmith.yml: adds the Azure VIP to the server certificates
chainsmith_hosts: "{% set nodes = [azure_vip_dns_fqdn] %}{% for node in chainsmith_nodes %}{% do nodes.append(hostvars[node].ansible_facts.fqdn) %}{% endfor %}{{ nodes }}"
chainsmith_ips: "{% set nodes = [azure_vip_ip] %}{% for node in chainsmith_nodes %}{% do nodes.append(hostvars[node].ansible_host) %}{% endfor %}{{ nodes }}"
chainsmith_servers: "{% set nodes = {azure_vip_dns_fqdn: chainsmith_hosts + chainsmith_ips} %}{% for node in chainsmith_nodes %}{% do nodes.update({hostvars[node].ansible_facts.fqdn: chainsmith_hosts + chainsmith_ips}) %}{% endfor %}{{ nodes }}"
