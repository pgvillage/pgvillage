site_name: PgVillage
site_url: https://pgvillage.github.io/pgvillage
site_author: Nibble-IT

# Repository
repo_name: pgvillage
repo_url: https://github.com/pgvillage/pgvillage
edit_uri: edit/main/docs

theme:
  name: material
  custom_dir: mkdocs_overrides
  logo: about/branding/logo.png
  favicon: about/branding/logo.png
  language: en
  hljs_languages:
    - yaml
    - go
    - bash
  features:
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.prune
    - search.suggest
    - search.share
    - toc.follow
copyright: >
  Copyright &copy; 2025 Nibble-IT

extra:
  version:
    provider: mike
    alias: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      title: On this page
      permalink: true
      toc_depth: 3
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      auto_title: false
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - social
  - tags
  - privacy
  - kroki:
      http_method: POST
  - literate-nav:
      nav_file: README.md
      implicit_index: true
  - redirects:
      redirect_maps:
        'index.md': 'architecture/overview.md'
        'administrators-guide/deployment_and_maintenance/multiinstance/avchecker.md': 'tools/avchecker.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/firewall.md': 'tools/firewall.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/haproxy.md': 'tools/haproxy.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/minio.md': 'tools/minio.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/nagios.md': 'tools/nagios.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/pgbouncer.md': 'tools/pgbouncer.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/pgquartz.md': 'tools/pgquartz.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/pgroute66.md': 'tools/pgroute66.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/stolon.md': 'tools/stolon.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/walg.md': 'tools/wal-g.md#multi-instance'

# Navigation
nav:
  - Architecture: architecture/
  - Tools: tools/
  - Guides:
      - Administrator Guide: administrators-guide/
      - User Guide: users-guide/
      - Developer Guide: developers-guide/
      - Tuning guide: tuning/
  - About:
      - Branding: about/branding/
      - License: about/license.md
