site_name: PgVillage
site_url: https://pgvillage.github.io/pgvillage
site_author: Nibble-IT

# Repository
repo_name: pgvillage
repo_url: https://github.com/pgvillage/pgvillage
edit_uri: edit/main/docs

theme:
  name: material
  custom_dir: mkdocs_overrides
  logo: about/branding/logo.png
  favicon: about/branding/logo.png
  language: en
  hljs_languages:
    - yaml
    - go
    - bash
  features:
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.prune
    - search.suggest
    - search.share
    - toc.follow
copyright: >
  Copyright &copy; 2025 Nibble-IT

extra:
  version:
    provider: mike
    alias: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      title: On this page
      permalink: true
      toc_depth: 3
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      auto_title: false
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - social
  - tags
  - privacy
  - kroki:
      http_method: POST
  - literate-nav:
      nav_file: README.md
      implicit_index: true
  - redirects:
      redirect_maps:
        'administrators-guide/deployment_and_maintenance/multiinstance/avchecker.md': 'tools/avchecker.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/firewall.md': 'tools/firewall.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/haproxy.md': 'tools/haproxy.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/minio.md': 'tools/minio.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/nagios.md': 'tools/nagios.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/pgbouncer.md': 'tools/pgbouncer.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/pgquartz.md': 'tools/pgquartz.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/pgroute66.md': 'tools/pgroute66.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/stolon.md': 'tools/stolon.md#multi-instance'
        'administrators-guide/deployment_and_maintenance/multiinstance/walg.md': 'tools/wal-g.md#multi-instance'
        'administrators-guide/platforms/index.md': 'index.md'
        'administrators-guide/platforms/lima.md': 'try-it/lima.md'
        'administrators-guide/platforms/vagrant/index.md': 'try-it/vagrant/index.md'
        'administrators-guide/platforms/vagrant/boxes.md': 'try-it/vagrant/boxes.md'
        'administrators-guide/platforms/macos.md': 'try-it/vagrant/macos.md'
        'administrators-guide/platforms/azure/deploy.md': 'try-it/azure.md'
        'administrators-guide/platforms/byo.md': 'deploy/byo.md'
        'administrators-guide/deployment_and_maintenance/inventory.md': 'deploy/inventory/index.md'
        'administrators-guide/platforms/vagrant/inventory.md': 'deploy/inventory/vagrant-example.md'
        'administrators-guide/deployment_and_maintenance/ansible.md': 'deploy/control-node/ansible.md'
        'administrators-guide/deployment_and_maintenance/ansible_cfg.md': 'deploy/control-node/ansible_cfg.md'
        'administrators-guide/platforms/ubuntu/index.md': 'deploy/os/debian.md'
        'administrators-guide/platforms/el/index.md': 'deploy/os/el.md'
        'administrators-guide/platforms/suse/index.md': 'deploy/os/suse.md'
        'administrators-guide/platforms/arm-vs-amd.md': 'deploy/os/arm-vs-amd.md'
        'administrators-guide/platforms/azure/index.md': 'deploy/platforms/azure/index.md'
        'administrators-guide/platforms/azure/azure.md': 'deploy/platforms/azure/azure.md'
        'administrators-guide/platforms/azure/amd-vs-arm.md': 'deploy/platforms/azure/amd-vs-arm.md'
        'administrators-guide/platforms/azure/el-vs-suse.md': 'deploy/platforms/azure/el-vs-suse.md'
        'administrators-guide/deployment_and_maintenance/multi-instance.md': 'deploy/multi-instance.md'
        'administrators-guide/deployment_and_maintenance/byo-server-certs.md': 'deploy/certificates/byo-server-certs.md'
