---
- name: Gather facts and apply pgvillage roles
  hosts: all
  become: true
  gather_facts: true
  vars:
    # Defaults; override (per role) with `pgvillage_roles` in the inventory.
    # Example:
    #   pgvillage_roles:
    #     minio: { enabled: false }
    #     nagios: { groups: [hacluster] }
    #     mycompany.hardening: { groups: [hacluster, backup] }
    _pgvillage_roles:
      linux:      { groups: [hacluster, backup, router, localhost], tags: [packages] }
      chainsmith: { groups: [hacluster, backup, router, localhost], tags: [certificates, certs] }
      firewall:   { groups: [hacluster, backup, router], tags: [firewalld] }
      etcd:       { groups: [etcd_master] }
      minio:      { groups: [backup] }
      walg:       { groups: [hacluster] }
      stolon:     { groups: [hacluster], tags: [postgres, postgresql, pg] }
      avchecker:  { groups: [hacluster], tags: [availability_checker] }
      haproxy:    { groups: [router], tags: [router] }
      keepalived: { groups: [router], tags: [router] }
      pgroute66:  { groups: [router], tags: [router] }
      pgbouncer:  { groups: [hacluster], tags: [bouncer, pooler] }
      nagios:     { groups: [hacluster, backup, router] }
      pgquartz:   { groups: [hacluster] }
  tasks:
    - name: Apply roles as defined in the inventory
      ansible.builtin.include_tasks: tasks/pgvillage_role.yml
      loop: "{{ _pgvillage_roles | combine(pgvillage_roles | default({}), recursive=True) | dict2items }}"
      loop_control:
        loop_var: _role
        label: "{{ _role.key }}"
      when:
        - _role.value.enabled | default(true) | bool
        - _role.value.groups | default([]) | intersect(group_names + [inventory_hostname]) | length > 0
      tags: always
